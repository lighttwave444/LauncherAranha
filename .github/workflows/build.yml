name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Instalar dependencias
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick
          npm install
      - name: Criar projeto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Icone, tela cheia, launcher e plugin
        run: |
          R=android/app/src/main/res
          M=android/app/src/main/AndroidManifest.xml
          rm -rf $R/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon.png -resize ${s}x${s} $R/mipmap-$n/$f.png
            done
          done
          sed -i 's|</style>|<item name="android:windowFullscreen">true</item><item name="android:windowLayoutInDisplayCutoutMode">shortEdges</item></style>|g' $R/values/styles.xml
          # tela inicial (HOME)
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" /><category android:name="android.intent.category.HOME" /><category android:name="android.intent.category.DEFAULT" />|' $M
          # permite enxergar/abrir os outros apps instalados
          sed -i 's|</manifest>|<queries><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent><intent><action android:name="android.intent.action.DIAL" /></intent></queries></manifest>|' $M
          # permissao para desenhar a moldura das janelas por cima dos apps
          sed -i 's|</manifest>|<uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" /></manifest>|' $M
          # plugin que abre apps
          J=android/app/src/main/java/com/launchertop/aranha
          cp native/*.java $J/
          # chave fixa para poder atualizar o app por cima
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Renomear
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LauncherAranha.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Launcher Aranha 1.0.${{ github.run_number }}
          files: LauncherAranha.apk
